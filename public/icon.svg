<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle border -->
  <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" />

  <!-- Glowing Book Graphic -->
  <g filter="url(#glow)" transform="translate(106, 106)">
    <!-- Book cover/pages -->
    <path d="M40 240 C40 160, 90 80, 150 70 C190 64, 260 70, 260 70 L260 210 C260 210, 190 204, 150 210 C100 218, 50 250, 40 260 Z" fill="url(#bookGrad)" opacity="0.9" />
    <path d="M260 70 C260 70, 330 64, 370 70 C430 80, 480 160, 480 240 L460 260 C450 250, 400 218, 350 210 C310 204, 260 210, 260 210 Z" fill="#818cf8" opacity="0.75" />
    
    <!-- Modern Minimalist Open Book Symbol -->
    <path d="M48 244 V96 C48 82.745 58.745 72 72 72 H240 V240 H72 C58.745 240 48 241.791 48 244 Z" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M252 72 H420 C433.255 72 444 82.745 444 96 V244 C444 241.791 433.255 240 420 240 H252 Z" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="246" y1="64" x2="246" y2="248" stroke="#a5b4fc" stroke-width="12" stroke-linecap="round" />
    <!-- Page lines -->
    <line x1="96" y1="120" x2="192" y2="120" stroke="rgba(255,255,255,0.7)" stroke-width="12" stroke-linecap="round" />
    <line x1="96" y1="160" x2="170" y2="160" stroke="rgba(255,255,255,0.7)" stroke-width="12" stroke-linecap="round" />
    <line x1="300" y1="120" x2="396" y2="120" stroke="rgba(255,255,255,0.7)" stroke-width="12" stroke-linecap="round" />
    <line x1="300" y1="160" x2="374" y2="160" stroke="rgba(255,255,255,0.7)" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
